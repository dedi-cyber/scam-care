<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Simulator latihan mengenali penipuan digital di Indonesia.">
<meta name="color-scheme" content="light dark">
<title>Cek Dulu!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: light technical field-manual. Sticky top bar, two-column play screen (phone left, decision panel right), cool grey ground, ink + one alarm orange, teal for "aman". */
:root{
  --bg:#FFF3E8; --sf:#FFFFFF; --sf2:#FFEADA; --ink:#2A180C; --mute:#7A5640; --line:#F2D3BA;
  --sig:#D9480F; --sigbg:#FFD5BC; --sigfg:#FFFFFF; --safe:#0B8A6F; --safebg:#D8F2E9; --warn:#8A5A00; --warnbg:#FFF0B3;
  --btn:#D9480F; --btnfg:#FFFFFF; --bubble:#FFE6D2; --meBubble:#2A180C; --meFg:#FFFFFF;
  --disp:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C110A; --sf:#281A12; --sf2:#33211A; --ink:#FFEFE3; --mute:#CDA88F; --line:#4A3226;
  --sig:#FF8A4C; --sigbg:#4D2713; --sigfg:#1A0E06; --safe:#3ACBA8; --safebg:#12382D; --warn:#F2BE3D; --warnbg:#41330E;
  --btn:#FF8A4C; --btnfg:#1A0E06; --bubble:#3A261B; --meBubble:#FFEFE3; --meFg:#1A0E06; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C110A; --sf:#281A12; --sf2:#33211A; --ink:#FFEFE3; --mute:#CDA88F; --line:#4A3226;
  --sig:#FF8A4C; --sigbg:#4D2713; --sigfg:#1A0E06; --safe:#3ACBA8; --safebg:#12382D; --warn:#F2BE3D; --warnbg:#41330E;
  --btn:#FF8A4C; --btnfg:#1A0E06; --bubble:#3A261B; --meBubble:#FFEFE3; --meFg:#1A0E06; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--sig);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--mute)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;border:0;background:none;padding:0;text-align:left}
.logo{width:38px;height:38px;border-radius:11px;background:var(--sig);color:var(--sigfg);display:grid;place-items:center;font:800 19px var(--disp);position:relative}
.logo i{position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--ink);border:2px solid var(--bg)}
.brand b{font:800 18px var(--disp);letter-spacing:-.02em;display:block;line-height:1}
.brand small{font:700 9.5px var(--mono);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.nav{display:flex;gap:2px;align-items:center;overflow-x:auto;max-width:100%;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:8px 11px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--mute)}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--sig);color:var(--sigfg)}
.xp{font:700 12px var(--mono);background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 12px;white-space:nowrap}
@media(max-width:640px){.bar-in{gap:6px}.nav{order:3;width:100%}}

main{padding-top:22px}
.view{animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.view{animation:none}*{scroll-behavior:auto!important;transition:none!important}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--btn);background:var(--btn);color:var(--btnfg);padding:12px 20px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn.sig{background:var(--sig);border-color:var(--sig);color:var(--sigfg)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;padding:8px 0 28px}
.hero h1{font-size:clamp(38px,6.2vw,72px);margin:12px 0 16px}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--sigbg) 62%);padding:0 4px;margin:0 -4px}
.lead{font-size:17px;color:var(--mute);max-width:54ch;margin-bottom:22px}
@media(max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}

/* phone / chat */
.phone{background:var(--sf);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 18px 40px -26px rgba(14,26,37,.5);min-width:0}
.ph-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--sf2)}
.av{width:34px;height:34px;border-radius:50%;background:var(--sig);color:var(--sigfg);display:grid;place-items:center;font:800 14px var(--disp);flex:none}
.ph-h b{display:block;font-size:14px;line-height:1.2}
.ph-h span{font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.chat{padding:16px;display:flex;flex-direction:column;gap:9px;min-height:200px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.5;background:var(--bubble);border-bottom-left-radius:5px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--meBubble);color:var(--meFg);border-radius:16px;border-bottom-right-radius:5px}
.msg.sys{align-self:center;max-width:100%;background:transparent;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:center}
.msg.file{display:flex;gap:10px;align-items:center}
.msg.file .ico{width:34px;height:40px;border-radius:7px;background:var(--sf);border:1.5px solid var(--mute);display:grid;place-items:center;font:700 9px var(--mono);flex:none;color:var(--mute)}
.msg.esc{background:var(--sigbg);color:var(--ink);border:1px solid var(--sig)}
.fl{font:inherit;color:inherit;border:0;background:none;padding:0 2px;margin:0 -1px;border-radius:4px;text-align:left;overflow-wrap:anywhere}
button.fl{cursor:pointer;background:var(--warnbg);box-shadow:inset 0 -2px 0 var(--warn)}
button.fl:hover{filter:brightness(.95)}
.fl.found{background:var(--sigbg);box-shadow:inset 0 -2px 0 var(--sig);color:var(--ink)}
.fl.ok{background:var(--safebg);box-shadow:inset 0 -2px 0 var(--safe);color:var(--ink)}
.fl.missed{background:transparent;box-shadow:inset 0 -2px 0 var(--mute);text-decoration:none;border-bottom:0}
.fl.hint{background:transparent;box-shadow:none}

/* cards, panels */
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r,18px);padding:20px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:6px 0 16px}
@media(max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font:800 30px/1 var(--disp);letter-spacing:-.02em;margin-bottom:4px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute)}
.bar-t{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.bar-t i{display:block;height:100%;background:var(--sig);border-radius:99px}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:860px){.steps4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st .k{width:34px;height:34px;border-radius:10px;background:var(--sig);color:var(--sigfg);display:grid;place-items:center;font:800 16px var(--disp);margin-bottom:10px}
.st b{display:block;font-size:16px;margin-bottom:2px}
.st span{font-size:13.5px;color:var(--mute);display:block}
.note{background:var(--safebg);border-radius:14px;padding:14px 18px;font-size:14px;margin-top:16px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 14px}
.sec-h h2{font-size:clamp(26px,3.6vw,36px)}

/* map */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1.5px solid var(--line);background:var(--sf);padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--sig);color:var(--sigfg);border-color:var(--sig)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile:hover{border-color:var(--ink)}
.tile h3{font-size:19px}
.tile .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--mute)}
.dots{display:flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink)}
.stars{font-size:15px;letter-spacing:2px;color:var(--line)}.stars b{color:var(--sig);font-weight:400}
.tile p{font-size:13.5px;color:var(--mute)}

/* play */
.crumb{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
@media(max-width:860px){.play{grid-template-columns:minmax(0,1fr)}}
.stepper{display:flex;gap:6px;margin-bottom:16px}
.stepper span{flex:1;text-align:center;font:700 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 2px;border-radius:9px;background:var(--sf);border:1px solid var(--line);color:var(--mute)}
.stepper span.on{background:var(--sig);color:var(--sigfg);border-color:var(--sig)}
.stepper span.done{color:var(--safe);border-color:var(--safe)}
.panel h2{font-size:26px;margin-bottom:6px}
.panel .sub{color:var(--mute);margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--sf2);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:600;line-height:1.4}
.opt:hover{border-color:var(--ink)}
.emo{display:flex;flex-wrap:wrap;gap:8px}
.emo .opt{padding:10px 16px;border-radius:999px;font-size:14.5px}
.found-list{display:grid;gap:8px;margin:14px 0}
.fnd{border-left:4px solid var(--sig);background:var(--sf2);border-radius:0 12px 12px 0;padding:10px 14px;font-size:14px}
.fnd.ok{border-color:var(--safe)}
.fnd.miss{border-color:var(--mute)}
.fnd b{display:block;font-size:12px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
input[type=range]{width:100%;accent-color:var(--sig);height:28px}
.conf-big{font:800 52px/1 var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.conf-lab{color:var(--mute);font-weight:600;margin:4px 0 10px;min-height:24px}
.scale{display:flex;justify-content:space-between;font:700 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.verdict{border-radius:14px;padding:14px 16px;margin:14px 0;font-weight:600}
.verdict.best{background:var(--safebg)}.verdict.ok{background:var(--warnbg)}
.verdict.risky{background:var(--warnbg)}.verdict.bad{background:var(--sigbg)}
.rows{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:14px 0}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.rows div:last-child{border:0;background:var(--sf2);font-weight:800}
.rows b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.official{background:var(--sf2);border-radius:14px;padding:14px 16px;font-size:14px;margin:14px 0}
.bigstars{font-size:30px;letter-spacing:4px;color:var(--line)}.bigstars b{color:var(--sig);font-weight:400}
.unlock{border:2px dashed var(--sig);border-radius:16px;padding:16px;margin:14px 0;background:var(--sf)}
.unlock h3{font-size:22px;margin:4px 0 6px}

/* cards view */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.kc{background:var(--sig);color:var(--sigfg);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:190px;min-width:0}
.kc h3{font-size:22px}
.kc p{font-size:14px;opacity:.88}
.kc .mono{color:inherit;opacity:.65}
.kc.lock{background:var(--sf);color:var(--mute);border:1.5px dashed var(--line)}
.kc.lock h3{color:var(--mute)}

/* checker */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
textarea{width:100%;min-height:190px;border:1.5px solid var(--line);background:var(--sf);color:var(--ink);border-radius:14px;padding:14px;font:15px/1.55 var(--body);resize:vertical}
mark{background:var(--sigbg);color:var(--ink);box-shadow:inset 0 -2px 0 var(--sig);border-radius:3px;padding:0 1px}
.mirror{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--sf);white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;margin-top:12px;max-height:260px;overflow:auto}
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;border-radius:99px;transition:width .3s}
.lvl{font:800 34px/1 var(--disp);letter-spacing:-.02em}

/* kilat */
.kil{max-width:640px;margin:0 auto}
.kq{font:700 22px/1.4 var(--body);background:var(--sf2);border-radius:16px;padding:22px;margin:14px 0;overflow-wrap:anywhere}
.two-b{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two-b .btn{padding:16px}

/* info */
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.list li{background:var(--sf2);border-radius:12px;padding:12px 14px;font-size:14.5px}
.list b{display:block}
.copyfield{font:500 13px/1.6 var(--mono);background:var(--sf2);border-radius:12px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:80}
footer{margin-top:34px;color:var(--mute);font-size:13px}
.foot{border-top:1px solid var(--line);padding-top:16px;text-align:center;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
</style>

</head>
<body>
<div class="bar"><div class="bar-in">
  <button class="brand" data-r="home" aria-label="Beranda Cek Dulu"><span class="logo">C<i></i></span><span><b>Cek Dulu!</b><small>Lab latihan anti-penipuan</small></span></button>
  <nav class="nav" id="nav" aria-label="Menu utama"></nav>
  <span class="xp" id="xpPill">0 XP</span>
</div></div>
<main class="wrap" id="app"></main>
<footer class="wrap"><div class="foot">© D.E.A. 2026 · Cek Dulu! Lab latihan anti-penipuan</div></footer>

/* ---------- CHAT RENDER ---------- */
function parse(t){var o=[],l=0,m,re=/\[\[(.+?)\|(.+?)\]\]/g;while((m=re.exec(t))){if(m.index>l)o.push({s:t.slice(l,m.index)});o.push({s:m[1],f:m[2]});l=re.lastIndex}if(l<t.length)o.push({s:t.slice(l)});return o}
function flagMap(c){var m={};c.flags.forEach(function(f){m[f.id]=f});return m}
/* mode: plain | tap | done ; st: {found:{}, tapped:{}} */
function seg(c,t,mode,st,pfx){
  var fm=flagMap(c);
  return parse(t).map(function(p){
    if(!p.f)return esc(p.s);
    var f=fm[p.f],tp=st.tapped[pfx+p.f],cls="fl";
    if(mode==="plain")return'<span class="fl hint">'+esc(p.s)+"</span>";
    if(mode==="tap"){
      if(tp)cls+=f.ok?" ok":" found";
      return'<button class="'+cls+'" data-f="'+pfx+p.f+'" aria-label="Tandai: '+esc(p.s)+'">'+esc(p.s)+"</button>";
    }
    if(tp)cls+=f.ok?" ok":" found";else if(!f.ok)cls+=" missed";else cls+=" hint";
    return'<span class="'+cls+'">'+esc(p.s)+"</span>";
  }).join("");
}
function chat(c,mode,st,extra,pfx){
  pfx=pfx||"";
  var h=c.msgs.map(function(m){
    var inner=seg(c,m.t,mode,st,pfx);
    if(m.w==="sys")return'<div class="msg sys">'+esc(m.t)+"</div>";
    if(m.f)return'<div class="msg file"><span class="ico">APK</span><span>'+inner+"</span></div>";
    return'<div class="msg '+(m.w==="me"?"me":"")+'">'+inner+"</div>";
  }).join("");
  return h+(extra||"");
}

}

function analyze(text){
  var hits=[],ranges=[],score=0;
  RULES.forEach(function(r){var m,re=new RegExp(r.re.source,r.re.flags),found=false;
    while((m=re.exec(text))){found=true;ranges.push([m.index,m.index+m[0].length]);if(m.index===re.lastIndex)re.lastIndex++}
    if(found){hits.push(r);score+=r.w}});
  ranges.sort(function(a,b){return a[0]-b[0]});
  var mg=[];ranges.forEach(function(r){var l=mg[mg.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else mg.push([r[0],r[1]])});
  var out="",p=0;mg.forEach(function(r){out+=esc(text.slice(p,r[0]))+"<mark>"+esc(text.slice(r[0],r[1]))+"</mark>";p=r[1]});out+=esc(text.slice(p));
  return{hits:hits,score:score,html:out};
}
function lvl(s){return s===0?["Tak ada pola dikenali","var(--safe)"]:s<4?["Rendah","var(--warn)"]:s<8?["Sedang","var(--warn)"]:s<13?["Tinggi","var(--sig)"]:["Sangat tinggi","var(--sig)"]}
function result(text){
  if(!text.trim())return'<p style="color:var(--mute)">Tempel pesan di kolom kiri. Pemeriksaan berjalan di perangkatmu, tidak ada yang dikirim ke mana pun.</p>';
  var a=analyze(text),l=lvl(a.score),pc=Math.min(100,a.score*8);
  return'<div class="mono">Tingkat kecurigaan</div><div class="lvl" style="color:'+l[1]+'">'+l[0]+'</div><div class="meter"><i style="width:'+pc+"%;background:"+l[1]+'"></i></div>'
   +(a.hits.length?'<div class="found-list">'+a.hits.map(function(h){return'<div class="fnd"><b>'+esc(h.t)+"</b>"+esc(h.d)+"</div>"}).join("")+"</div>":"")
   +'<div class="official"><b>Yang bisa kamu lakukan:</b> jangan klik, jangan balas, jangan sebut kode. Buka aplikasi resmi sendiri atau hubungi kontak yang sudah kamu kenal. Alat ini hanya membantu mengenali pola. Pesan tanpa tanda pun tetap bisa berbahaya.</div>'
   +'<div class="mirror" aria-label="Pesan dengan penanda">'+a.html+"</div>";
}

function newK(){var idx=KILAT.map(function(_,i){return i});for(var i=idx.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}
  return{q:idx.slice(0,10),i:0,ok:0,combo:0,gain:0,ans:null}}

/* ---------- CONTROL ---------- */
function applyTheme(){var r=document.documentElement;if(S.theme==="dark"||S.theme==="light")r.setAttribute("data-theme",S.theme);else r.removeAttribute("data-theme")}
function go(r,noscroll){route=r;render();if(!noscroll)window.scrollTo(0,0)}
function render(){
  nav();
  var v={home:vHome,peta:vPeta,play:vPlay,kartu:vKartu,periksa:vPeriksa,kilat:vKilat,info:vInfo}[route]||vHome;
  var keepY=window.scrollY;
  $("#app").innerHTML=v();
  if(route==="play"||route==="kilat"||route==="home")window.scrollTo(0,keepY);
}
function startCase(id){
  var c=CASES.filter(function(x){return x.id===id})[0];if(!c)return;
  P={c:c,step:0,emo:null,tapped:{},conf:50,res:null};route="play";render();window.scrollTo(0,0);
}
function finishDecision(i){
  var c=P.c,o=c.opts[i];
  var emoXp=P.emo===c.emo?5:0;
  var flagXp=0;c.flags.forEach(function(f){if(P.tapped[f.id]&&!f.ok)flagXp+=8});
  if(c.truth==="legit"){flagXp=0;}
  var exp=c.truth==="scam"?100:0,err=Math.abs(P.conf-exp),mult=c.truth==="legit"?2:1;
  var calXp=(err<=25?15:err<=50?6:0)*mult;
  var decXp=VXP[o.v],total=emoXp+flagXp+calXp+decXp;
  var prev=S.cases[c.id],pxp=prev?prev.xp:0,pst=prev?prev.stars:0;
  S.cases[c.id]={xp:Math.max(pxp,total),stars:Math.max(pst,VST[o.v])};
  touch();save();
  P.res={o:o,emoXp:emoXp,flagXp:flagXp,calXp:calXp,decXp:decXp,total:total,delta:S.cases[c.id].xp-pxp};
  P.step=3;render();
  setTimeout(function(){P.step=4;render();window.scrollTo(0,0)},1500);
}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-r],[data-act],[data-case],[data-filter],[data-emo],[data-f],[data-opt],[data-k],[data-sample]");
  if(!t)return;
  if(t.dataset.r){confirmReset=false;if(t.dataset.r!=="kilat")K=K&&K.i>=K.q.length?null:K;go(t.dataset.r);return}
  if(t.dataset.filter){filter=t.dataset.filter;render();return}
  if(t.dataset.case){startCase(t.dataset.case);return}
  if(t.dataset.f&&route==="home"){var fid=t.dataset.f;demo["d:"+fid]=1;render();return}
  if(t.dataset.f&&P){P.tapped[t.dataset.f]=1;touch();render();return}
  if(t.dataset.emo&&P&&!P.emo){P.emo=t.dataset.emo;render();return}
  if(t.dataset.opt!==undefined&&P&&!P.res){finishDecision(+t.dataset.opt);return}
  if(t.dataset.k!==undefined&&K&&K.ans===null){
    var it=KILAT[K.q[K.i]];K.ans=+t.dataset.k;var good=(K.ans===1)===!!it.s;
    if(good){K.ok++;K.combo++;if(!S.kilat[K.q[K.i]]){S.kilat[K.q[K.i]]=1;K.gain+=8;touch();save()}}else K.combo=0;
    render();return}
  if(t.dataset.sample!==undefined){chk=t.dataset.sample==="x"?"":SAMPLES[+t.dataset.sample];render();return}
  var a=t.dataset.act;
  if(a==="next"){var nc=CASES.filter(function(c){return!S.cases[c.id]})[0]||CASES[0];startCase(nc.id)}
  else if(a==="s1"){P.step=1;render()}
  else if(a==="s2"){P.step=2;render()}
  else if(a==="s3"){P.step=3;render()}
  else if(a==="nextcase"){var i=CASES.indexOf(P.c),nx=CASES.slice(i+1).concat(CASES.slice(0,i)).filter(function(c){return!S.cases[c.id]})[0]||CASES[(i+1)%CASES.length];startCase(nx.id)}
  else if(a==="knext"){K.i++;K.ans=null;render()}
  else if(a==="kagain"){K=newK();render()}
  else if(a==="theme"){S.theme=S.theme===""?"light":S.theme==="light"?"dark":"";save();applyTheme();render()}
  else if(a==="reset1"){confirmReset=true;render()}
  else if(a==="reset0"){confirmReset=false;render()}
  else if(a==="reset2"){S={cases:{},kilat:{},streak:0,last:"",theme:S.theme};save();confirmReset=false;demo={};toast("Progres dihapus");render()}
  else if(a==="copy"){var done=function(){toast("Daftar tersalin")};
    try{navigator.clipboard.writeText(CHECKLIST).then(done,function(){selectField()})}catch(er){selectField()}}
});
function selectField(){var el=$("#cl2");if(!el)return;var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);toast("Pilih lalu salin manual")}
document.addEventListener("input",function(e){
  if(e.target.id==="slider"&&P){P.conf=+e.target.value;$("#cv").textContent=P.conf+"%";$("#cl").textContent=confLabel(P.conf)}
  if(e.target.id==="chk"){chk=e.target.value;$("#chkRes").innerHTML=result(chk)}
});

applyTheme();
var h=(location.hash||"").replace("#","");
if(["peta","kartu","periksa","kilat","info"].indexOf(h)>=0)route=h;
render();
</script>
